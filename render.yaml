services:
  - type: web
    name: inheritance-backend
    env: go
    plan: starter
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
